<!-- ================ start banner area ================= -->
<section class="blog-banner-area" id="category">
  <div class="container h-100">
    <div class="blog-banner">
      <div class="text-center">
        <h1>Регистрация</h1>
        <nav aria-label="breadcrumb" class="banner-breadcrumb">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Главная</a></li>
            <li class="breadcrumb-item active" aria-current="page">Регистрация</li>
          </ol>
        </nav>
      </div>
    </div>
  </div>
</section>
<!-- ================ end banner area ================= -->

<!--================Login Box Area =================-->
<section class="login_box_area section-margin">
  <div class="container">
    <div class="row">
      <div class="col-lg-6">
        <div class="login_box_img">
          <div class="hover">
            <h4>Вы уже зарегистрированы?</h4>
            <p>Тогда войдите, чтобы использовать накопленные скидки и преимущества.</p>
            <a class="button button-account" href="auth">На страницу входа</a>
          </div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="login_form_inner register_form_inner">
          <h3>Создать аккаунт</h3>
          <form class="row login_form" onsubmit="sendForm(this); return false;">
            <div class="col-md-12 form-group">
              <input
                type="text"
                class="form-control"
                name="name"
                placeholder="Ваше имя"
                onfocus="this.placeholder = ''"
                onblur="this.placeholder = 'Ваше имя'"
                required
                autocomplete="name"
              />
            </div>
            <div class="col-md-12 form-group">
              <input
                type="text"
                class="form-control"
                name="lastname"
                placeholder="Ваша фамилия"
                onfocus="this.placeholder = ''"
                onblur="this.placeholder = 'Ваша фамилия'"
                required
                autocomplete="family-name"
              />
            </div>
            <div class="col-md-12 form-group">
              <input
                type="email"
                class="form-control"
                name="email"
                placeholder="Email"
                onfocus="this.placeholder = ''"
                onblur="this.placeholder = 'Email'"
                required
                autocomplete="email"
              />
            </div>
            <div class="col-md-12 form-group">
              <input
                type="password"
                class="form-control"
                name="pass"
                placeholder="Пароль"
                onfocus="this.placeholder = ''"
                onblur="this.placeholder = 'Пароль'"
                required
                autocomplete="new-password"
              />
            </div>
            <div class="col-md-12 form-group">
              <div class="creat_account">
                <input type="checkbox" id="f-option2" />
                <label for="f-option2">Согласие на обработку персональных данных</label>
              </div>
            </div>
            <p id="info" style="color: red; padding-left: 15px;"></p>
            <div class="col-md-12 form-group">
              <button type="submit" class="button button-register w-100">Регистрироваться</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
<!--================End Login Box Area =================-->

<!-- Модальное окно -->
<div
  class="modal fade"
  id="registerModal"
  tabindex="-1"
  aria-labelledby="exampleModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title w-100 text-center" id="exampleModalLabel">Вы успешно зарегистрированы</h5>
      </div>
      <div class="modal-body text-center">И будете перенаправлены на страницу входа через 3 секунды.</div>
      <div class="modal-footer"></div>
    </div>
  </div>
</div>

<!-- Модальное окно -->

<script>
  async function sendForm(form) {
    let data = new FormData(form);

    let response = await fetch("addUser", {
      method: "POST",
      body: data,
    });
    let answer = await response.json();
    if (answer.result == "success") {
      $("#registerModal").modal("show");
      setTimeout(() => {
        location.href = "auth";
      }, 3000);
    } else if (answer.result == "exist") {
      info.innerText = "Проверьте Email";
    } else if (answer.result == "empty") {
      info.innerText = "Все поля должны быть заполнены";
    } else {
      alert ("Неизвестная ошибка");
    }
  }
</script>
